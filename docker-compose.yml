services:
  db:
    image: postgres:16
    container_name: uwpathr_postgres
    restart: unless-stopped
    env_file:
      - .env.${ENVIRONMENT}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: uwpathr_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/__pycache__
    working_dir: /app
    command: sh -c "./initialize_db.sh && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/.env.${ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: uwpathr_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.${ENVIRONMENT}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
